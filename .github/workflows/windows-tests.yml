name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run tests
        run: python -B -m unittest discover -s tests
      - name: Build Windows package
        shell: pwsh
        run: .\build_cleanup_package.ps1 -PythonExe (Get-Command python).Source
      - name: Verify packaged application
        run: python -B -m unittest tests.test_package_contents -v
